name: PDFora frontend validation

on:
  pull_request:
    branches:
      - niroj-tools-development
      - master
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  push:
    branches:
      - seo-tool-pages-800-1200
      - qa/168-tool-functional-audit-2026-11-04
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify tool catalog and handlers
        run: npm run verify:tools
      - name: Run TypeScript type check
        run: npx tsc --noEmit
      - name: Run ESLint
        run: npm run lint
      - name: Build production frontend
        run: npm run build
