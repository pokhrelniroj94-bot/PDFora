name: PDFora frontend validation

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  push:
    branches:
      - master
      - niroj-tools-development
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify tool catalog and handlers
        run: npm run verify:tools
      - name: Run ESLint
        run: npm run lint
      - name: Build production frontend
        run: npm run build
