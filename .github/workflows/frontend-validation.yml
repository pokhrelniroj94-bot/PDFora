name: PDFora frontend validation

on:
  pull_request:
    branches:
      - niroj-tools-development
      - i18n/global-multilingual
      - feature/complete-12-language-platform
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"
  push:
    branches:
      - seo-tool-pages-800-1200
      - i18n/global-multilingual
      - fix/published-language-switcher
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify tool catalog and handlers
        run: npm run verify:tools
      - name: Test i18n runtime
        run: npm run i18n:test
      - name: Check i18n content
        run: npm run i18n:check
      - name: Run ESLint
        run: npm run lint
      - name: Build production frontend
        run: npm run build
