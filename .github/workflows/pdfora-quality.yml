name: PDFora quality and security checks
on:
  pull_request:
    branches: [main, master, feat/free-market-data-fallbacks, i18n/global-multilingual, feature/complete-12-language-platform]
  push:
    branches: [master, niroj77-seo-ux-security, i18n/global-multilingual, fix/published-language-switcher, codex/multilingual-completion]
  workflow_dispatch:
permissions:
  contents: read
# Keep only the latest commit's full 173-tool QA run; superseded commits must not consume hours of CI.
concurrency:
  group: pdfora-quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check legacy Express backend syntax
        run: node --check backend/backend/server.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend functional regression tests
        run: pip install pytest httpx requests && pytest -q backend/tests
      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify every catalog tool has one implementation
        run: npm run verify:tools
      - name: Test i18n runtime
        run: npm run i18n:test
      - name: Check i18n content
        run: npm run i18n:check
      - run: npm run lint
      - run: npm run build
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Read-only production security, privacy and SEO smoke checks
        id: production-security
        continue-on-error: true
        run: node scripts/production-security-smoke.mjs
      - name: Install headless Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Start production server for browser tests
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/pdfora-next.log 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Next.js production server is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pdfora-next.log
          exit 1
      - name: Warm the Render PDF backend before browser processing tests
        run: |
          for attempt in {1..45}; do
            if curl --max-time 8 --fail --silent https://pdfora-493r.onrender.com/ > /dev/null; then
              echo "Render backend is responding."
              exit 0
            fi
            sleep 2
          done
          echo "Render backend did not respond within 90 seconds."
          exit 1
      - name: Check browser and live-data smoke runner syntax
        run: |
          node --check scripts/browser-e2e-173.mjs
          node --check scripts/live-data-smoke.mjs
          node --check scripts/production-security-smoke.mjs
          node --check scripts/preview-ai-smoke.mjs
          node --check scripts/security-config.test.mjs
      - name: Verify security configuration and privacy controls
        id: security-config
        continue-on-error: true
        run: node scripts/security-config.test.mjs
      - name: Verify live NRB, NEPSE and Nepal news freshness/fallback
        id: live-data-smoke
        continue-on-error: true
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: node scripts/live-data-smoke.mjs
      - name: Verify local build security, privacy and SEO controls
        id: local-security-smoke
        continue-on-error: true
        env:
          PDFORA_PRODUCTION_URL: http://127.0.0.1:3000
          PDFORA_EXPECT_CANONICAL_ORIGIN: https://pd-fora.vercel.app
        run: node scripts/production-security-smoke.mjs
      - name: Run individual Chromium E2E checks for all 173 tools
        id: browser-e2e
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_TOOL_TIMEOUT_MS: "45000"
        run: node scripts/browser-e2e-173.mjs
      - name: Run real Cloudflare Workers AI and Upstash checks on protected Preview
        id: preview-ai-smoke
        continue-on-error: true
        env:
          PDFORA_AI_PREVIEW_URL: https://pd-fora-git-qa-173-tool-br-168b6d-pokhrelniroj94-7012s-projects.vercel.app
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/preview-ai-smoke.mjs
      - name: Regenerate audit with browser evidence
        if: always()
        run: npm run audit:functional
      - name: Upload individual tool E2E and functional audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfora-browser-e2e-173-report
          path: |
            docs/qa/BROWSER_E2E_173_REPORT.json
            docs/qa/FUNCTIONAL_TOOL_AUDIT.json
            docs/qa/FUNCTIONAL_TOOL_AUDIT.md
          if-no-files-found: warn
      - name: Fail CI when any individual E2E check fails
        if: steps.browser-e2e.outcome == 'failure'
        run: exit 1
      - name: Fail CI when live Preview AI provider checks fail
        if: steps.preview-ai-smoke.outcome == 'failure'
        run: exit 1
      - name: Fail CI after all QA when production smoke checks fail
        if: steps.production-security.outcome == 'failure'
        run: exit 1
      - name: Fail CI after all QA when local security checks fail
        if: steps.local-security-smoke.outcome == 'failure'
        run: exit 1
      - name: Fail CI after all QA when security configuration checks fail
        if: steps.security-config.outcome == 'failure'
        run: exit 1
      - name: Fail CI after all QA when live-data checks fail
        if: steps.live-data-smoke.outcome == 'failure'
        run: exit 1

  live-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live smoke-test dependencies
        run: pip install -r backend/requirements.txt requests pytest httpx
      - name: Verify deployed Render backend
        run: python backend/tests/live_production_smoke.py
