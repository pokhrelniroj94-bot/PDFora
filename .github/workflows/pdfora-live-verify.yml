name: PDFora post-deploy PDF regression
on:
  push:
    branches: [pdfora-live-verify]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  verify-live-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test client
        run: pip install pypdf requests
      - name: Verify deployed Render endpoints
        env:
          PDFORA_API: https://pdfora-493r.onrender.com
        run: |
          python - <<'PY'
          import io, os, time, requests
          from pypdf import PdfReader, PdfWriter
          base = os.environ["PDFORA_API"]
          for attempt in range(24):
              try:
                  health = requests.get(base + "/health", timeout=20)
                  if health.ok:
                      print("Render health:", health.status_code, health.text)
                      break
              except requests.RequestException as exc:
                  print("Waiting for Render:", exc)
              time.sleep(10)
          else:
              raise SystemExit("Render backend did not become healthy in 4 minutes")
          writer = PdfWriter()
          writer.add_blank_page(width=612, height=792)
          writer.add_blank_page(width=612, height=792)
          sample = io.BytesIO()
          writer.write(sample)
          pdf_bytes = sample.getvalue()
          # Protect PDF: output must be a valid encrypted PDF and decrypt with the supplied password.
          protected = requests.post(
              base + "/api/protect",
              files={"file": ("regression.pdf", pdf_bytes, "application/pdf")},
              data={"password": "PDFora-Regression-2026"},
              timeout=90,
          )
          print("Protect PDF:", protected.status_code, protected.headers.get("content-type"), len(protected.content))
          protected.raise_for_status()
          encrypted = PdfReader(io.BytesIO(protected.content))
          assert encrypted.is_encrypted, "Protect PDF returned an unencrypted document"
          assert encrypted.decrypt("PDFora-Regression-2026"), "Protected PDF did not decrypt with the supplied password"
          assert len(encrypted.pages) == 2, "Protected PDF page count changed"
          print("Protect PDF PASS: encrypted, password verified, 2 pages preserved")
          # PDF Information: PDFs without metadata must still return a readable report.
          info = requests.post(
              base + "/api/pdf-info",
              files={"file": ("no-metadata.pdf", pdf_bytes, "application/pdf")},
              timeout=90,
          )
          print("PDF Information:", info.status_code, info.headers.get("content-type"), len(info.content))
          info.raise_for_status()
          report = info.content.decode("utf-8", errors="replace")
          assert "Page count: 2" in report, report
          assert "Title: Not set" in report, report
          assert "Author: Not set" in report, report
          print("PDF Information PASS: no-metadata PDF produced complete report")
          api = requests.get(base + "/api", timeout=30)
          api.raise_for_status()
          tools = api.json().get("tools", [])
          assert "pdf-to-excel" in tools, "PDF-to-Excel missing from API directory"
          print("API directory PASS: PDF-to-Excel is listed; tools:", len(tools))
          PY
