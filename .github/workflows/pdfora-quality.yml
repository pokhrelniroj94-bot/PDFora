name: PDFora quality and security checks
on:
  pull_request:
    branches: [main, master, feat/free-market-data-fallbacks]
  push:
    branches: [master, niroj77-seo-ux-security, codex/niroj-tools-development]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check legacy Express backend syntax
        run: node --check backend/backend/server.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend functional regression tests
        run: pip install pytest httpx requests && pytest -q backend/tests
      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify every catalog tool has one implementation
        run: npm run verify:tools
      - run: npm run lint
      - run: npm run build
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high

  live-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live smoke-test dependencies
        run: pip install -r backend/requirements.txt requests pytest httpx
      - name: Verify deployed Render backend
        run: python backend/tests/live_production_smoke.py
