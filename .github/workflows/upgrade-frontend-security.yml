name: Upgrade vulnerable frontend dependencies
on:
  push:
    branches: [security-next-upgrade-2026-11-18]
permissions:
  contents: write
jobs:
  upgrade-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-next-upgrade-2026-11-18
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Upgrade Next.js to patched release
        run: npm install next@16.4.6 eslint-config-next@16.4.6 @sentry/nextjs@11.14.0 --save-exact
      - name: Apply non-breaking dependency updates only
        run: npm audit fix || echo "Safe updates attempted; unresolved advisories remain a blocking release gate."
      - name: Record resolved dependency versions
        run: npm ls next eslint-config-next @sentry/nextjs picomatch --all || true
      - name: Lint
        run: npm run lint
      - name: Production build
        id: production-build
        run: npm run build
      - name: Commit build-verified dependency updates
        if: steps.production-build.outcome == 'success'
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: update Next.js and Sentry dependencies [skip ci]"
            git pull --rebase origin security-next-upgrade-2026-11-18
            git push origin HEAD:security-next-upgrade-2026-11-18
          fi
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload generated lockfile for review if audit remains blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfora-security-lockfile-candidate
          path: |
            frontend/package.json
            frontend/package-lock.json
          if-no-files-found: error
