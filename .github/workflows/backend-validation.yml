name: PDFora backend validation

on:
  pull_request:
    branches:
      - master
      - niroj-tools-development
      - i18n/global-multilingual
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"
  push:
    branches:
      - master
      - niroj-tools-development
      - i18n/global-multilingual
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest httpx requests
      - name: Compile backend
        run: python -m compileall -q .
      - name: Run backend regression tests
        run: pytest -q tests
