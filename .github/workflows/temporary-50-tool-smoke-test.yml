name: Temporary PDFora live 50-tool smoke test
on:
  push:
    branches: [temporary-50-tool-smoke-test]
permissions:
  contents: read
jobs:
  live-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pymupdf pillow pypdf
      - name: Test all PDFora live API tools
        env:
          PDFORA_API: https://pdfora-493r.onrender.com
        run: python backend/smoke_test_all_tools.py
