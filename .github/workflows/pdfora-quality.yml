name: PDFora quality and security checks
on:
  pull_request:
    branches: [main, master, feat/free-market-data-fallbacks, i18n/global-multilingual, feature/complete-12-language-platform]
  push:
    branches: [master, niroj77-seo-ux-security, i18n/global-multilingual, fix/published-language-switcher]
  workflow_dispatch:
permissions:
  contents: read
# Keep only the latest commit's full 169-tool QA run; superseded commits must not consume hours of CI.
concurrency:
  group: pdfora-quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check legacy Express backend syntax
        run: node --check backend/backend/server.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend functional regression tests
        run: pip install pytest httpx requests && pytest -q backend/tests
      - name: Audit Python dependencies
        run: pip install pip-audit && pip-audit -r backend/requirements.txt
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Verify every catalog tool has one implementation
        run: npm run verify:tools
      - name: Test i18n runtime
        run: npm run i18n:test
      - name: Check i18n content
        run: npm run i18n:check
      - run: npm run lint
      - run: npm run build
      - name: Audit npm dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Read-only production security, privacy and SEO smoke checks
        id: production-smoke
        continue-on-error: true
        run: node scripts/production-security-smoke.mjs
      - name: Install headless Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
      - name: Start production server for browser tests
        run: |
          npm start -- --hostname 127.0.0.1 > /tmp/pdfora-next.log 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Next.js production server is ready."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/pdfora-next.log
          exit 1
      - name: Check every sitemap URL and robots policy
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          PDFORA_EXPECT_CANONICAL_ORIGIN: https://pd-fora.vercel.app
        run: node scripts/sitemap-route-smoke.mjs
      - name: Warm the Render PDF backend before browser processing tests
        run: |
          for attempt in {1..45}; do
            if curl --max-time 8 --fail --silent https://pdfora-493r.onrender.com/ > /dev/null; then
              echo "Render backend is responding."
              exit 0
            fi
            sleep 2
          done
          echo "Render backend did not respond within 90 seconds."
          exit 1
      - name: Check browser and live-data smoke runner syntax
        run: |
          node --check scripts/browser-e2e-173.mjs
          node --check scripts/live-data-smoke.mjs
          node --check scripts/production-security-smoke.mjs
          node --check scripts/sitemap-route-smoke.mjs
      - name: Verify live NRB, NEPSE and Nepal news freshness/fallback
        id: live-data-smoke
        continue-on-error: true
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
        run: node scripts/live-data-smoke.mjs
      - name: Verify local build security, privacy and SEO controls
        id: local-security-smoke
        continue-on-error: true
        env:
          PDFORA_PRODUCTION_URL: http://127.0.0.1:3000
          PDFORA_EXPECT_CANONICAL_ORIGIN: https://pd-fora.vercel.app
        run: node scripts/production-security-smoke.mjs
      - name: Run Chromium E2E check for the two-file Merge PDF workflow
        id: browser-e2e
        continue-on-error: true
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_TOOL_TIMEOUT_MS: "45000"
          E2E_TOOL_FILTER: "merge-pdf"
        run: node scripts/browser-e2e-173.mjs
      - name: Regenerate audit with browser evidence
        if: always()
        run: npm run audit:functional
      - name: Upload individual tool E2E and functional audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfora-browser-e2e-173-report
          path: |
            docs/qa/BROWSER_E2E_173_REPORT.json
            docs/qa/FUNCTIONAL_TOOL_AUDIT.json
            docs/qa/FUNCTIONAL_TOOL_AUDIT.md
          if-no-files-found: warn
      - name: Fail CI when any individual E2E check fails
        if: always() && steps.browser-e2e.outcome == 'failure'
        run: exit 1
      - name: Fail CI after reports when production smoke checks fail
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.production-smoke.outcome == 'failure'
        run: exit 1
      - name: Fail CI after all reports when live-data checks fail
        if: always() && steps.live-data-smoke.outcome == 'failure'
        run: exit 1
      - name: Fail CI after all reports when local security checks fail
        if: always() && steps.local-security-smoke.outcome == 'failure'
        run: exit 1

  live-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the removed AI API is absent before frontend smoke tests
        env:
          PDFORA_PRODUCTION_URL: https://pd-fora.vercel.app
        run: |
          for attempt in {1..60}; do
            status=$(curl --silent --show-error --max-time 15 -o /dev/null -w "%{http_code}" \
              -X POST "$PDFORA_PRODUCTION_URL/api/ai-writing" \
              -H "Origin: https://attacker.example" \
              -H "Content-Type: application/json" \
              --data "not-json" || true)
            if [ "$status" = "404" ]; then
              echo "Removed AI API route returns 404."
              exit 0
            fi
            echo "Waiting for AI API removal to reach production (attempt $attempt/60; HTTP $status)."
            sleep 5
          done
          echo "Removed AI API route did not return 404 within five minutes."
          exit 1
      - name: Wait for the updated Rotate PDF page to reach production
        env:
          PDFORA_PRODUCTION_URL: https://pd-fora.vercel.app
        run: |
          for attempt in {1..90}; do
            html=$(curl --silent --show-error --max-time 15 "$PDFORA_PRODUCTION_URL/rotate-pdf" || true)
            if printf '%s' "$html" | grep -Fq "Choose the correct PDF rotation angle"; then
              echo "Updated PDFora production deployment is live."
              exit 0
            fi
            echo "Waiting for the new Vercel deployment (attempt $attempt/90)."
            sleep 5
          done
          echo "The updated Rotate PDF page did not reach production within 7.5 minutes."
          exit 1
      - name: Verify deployed frontend security, privacy and SEO
        env:
          PDFORA_PRODUCTION_URL: https://pd-fora.vercel.app
          PDFORA_EXPECT_CANONICAL_ORIGIN: https://pd-fora.vercel.app
        run: node frontend/scripts/production-security-smoke.mjs
      - name: Install headless Chrome for production Lighthouse
        id: lighthouse-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run production Lighthouse mobile performance tests
        id: production-lighthouse
        continue-on-error: true
        env:
          PDFORA_PRODUCTION_URL: https://pd-fora.vercel.app
          CHROME_PATH: ${{ steps.lighthouse-chrome.outputs.chrome-path }}
        run: |
          mkdir -p docs/qa/lighthouse-production
          routes=(/ /merge-pdf /rotate-pdf /pdf-to-excel /tools/reading-time-calculator /tools/savings-goal-calculator /tools/percentage-change-calculator)
          for route in "${routes[@]}"; do
            slug=$(printf '%s' "$route" | sed 's#^/$#home#; s#^/##; s#/#-#g')
            echo "Running Lighthouse mobile: $route"
            npx --yes lighthouse@13.6.0 "$PDFORA_PRODUCTION_URL$route" \
              --chrome-path="$CHROME_PATH" \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --form-factor=mobile \
              --only-categories=performance \
              --max-wait-for-load=60000 \
              --output=json \
              --output-path="docs/qa/lighthouse-production/$slug.json" \
              --quiet || echo "Lighthouse failed for $route" >> "$GITHUB_STEP_SUMMARY"
          done
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const dir = "docs/qa/lighthouse-production";
          const files = fs.readdirSync(dir).filter((name) => name.endsWith(".json")).sort();
          const rows = files.map((name) => {
            const report = JSON.parse(fs.readFileSync(dir + "/" + name, "utf8"));
            const audit = (id) => report.audits?.[id]?.displayValue || "n/a";
            return {
              page: name.replace(/\.json$/, ""),
              score: report.categories?.performance?.score == null ? "n/a" : Math.round(report.categories.performance.score * 100),
              lcp: audit("largest-contentful-paint"),
              cls: audit("cumulative-layout-shift"),
              tbt: audit("total-blocking-time"),
              fcp: audit("first-contentful-paint"),
              speed: audit("speed-index"),
            };
          });
          const table = rows.length
            ? ["| Page | Performance | LCP | CLS | TBT (lab proxy) | FCP | Speed Index |", "|---|---:|---:|---:|---:|---:|---:|", ...rows.map((r) => `| ${r.page} | ${r.score} | ${r.lcp} | ${r.cls} | ${r.tbt} | ${r.fcp} | ${r.speed} |`)].join("\n")
            : "No Lighthouse JSON reports were produced. Check the Lighthouse step logs.";
          const summary = "# PDFora production Lighthouse (mobile lab)\n\n" + table + "\n\nTBT is a lab diagnostic, not field INP. These Lighthouse results are lab measurements, not CrUX field Core Web Vitals.\n";
          fs.writeFileSync(dir + "/SUMMARY.md", summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
      - name: Upload production Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdfora-production-lighthouse
          path: docs/qa/lighthouse-production/
          if-no-files-found: warn
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live smoke-test dependencies
        run: pip install -r backend/requirements.txt requests pytest httpx
      - name: Verify deployed Render backend
        run: python backend/tests/live_production_smoke.py
